[project]
name = "seo-mcp"
version = "0.1.0"
description = "Read-only MCP server: one call returns the SEO data of a site."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "httpx2>=2.16,<3", "google-auth>=2.62,<3"]

[project.scripts]
seo-mcp = "seo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
files = ["src", "scripts"]
strict = true
untyped_calls_exclude = ["google.auth"]
